<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم | كرار علي</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #0f1d41,
                    #2563eb
                );
        }

        .login-box {
            width: 100%;
            max-width: 430px;

            background: white;
            padding: 40px;

            border-radius: 24px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.25);

            text-align: center;
        }

        .login-logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #2563eb;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
            font-weight: bold;
        }

        .login-box h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .login-box p {
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;

            padding: 15px;

            border: 1px solid #cbd5e1;
            border-radius: 12px;

            font-size: 17px;
            text-align: center;

            outline: none;
            margin-bottom: 15px;
        }

        .login-box input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,.12);
        }

        .login-btn {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 12px;

            background: #2563eb;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        #loginError {
            display: none;

            margin-top: 15px;

            color: #dc2626;
        }


        /* =========================
           DASHBOARD
        ========================= */

        #dashboard {
            display: none;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background: #101d40;
            color: white;

            padding: 18px 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,.15);
        }

        .brand h1 {
            font-size: 29px;
            margin-bottom: 5px;
        }

        .brand p {
            color: #cbd5e1;
            font-size: 14px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #dcfce7;
        }

        .status-dot {
            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px
                rgba(34,197,94,.8);
        }

        .logout-btn {
            border: none;

            background: #b91c1c;
            color: white;

            padding: 11px 18px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;
        }

        .logout-btn:hover {
            background: #991b1b;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: 92%;
            max-width: 1550px;

            margin: 30px auto;
        }


        /* =========================
           ALERT
        ========================= */

        #newRequestAlert {
            display: none;

            background: #2563eb;
            color: white;

            padding: 17px 22px;

            border-radius: 14px;

            margin-bottom: 22px;

            align-items: center;
            justify-content: space-between;

            box-shadow:
                0 8px 25px
                rgba(37,99,235,.25);
        }

        .alert-content {
            display: flex;
            align-items: center;
            gap: 12px;

            font-weight: bold;
        }

        .alert-icon {
            font-size: 25px;
        }

        .alert-close {
            width: 34px;
            height: 34px;

            border: none;
            border-radius: 50%;

            background:
                rgba(255,255,255,.2);

            color: white;

            font-size: 22px;

            cursor: pointer;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            padding: 14px;

            border-radius: 10px;

            margin-bottom: 18px;

            text-align: center;

            font-weight: bold;
        }

        .message.success {
            display: block;

            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;

            background: #fee2e2;
            color: #991b1b;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: white;

            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 7px 25px
                rgba(15,23,42,.08);

            border-top:
                4px solid #2563eb;
        }

        .stat-title {
            color: #64748b;

            margin-bottom: 12px;

            font-size: 16px;
        }

        .stat-number {
            color: #2563eb;

            font-size: 36px;

            font-weight: bold;
        }


        /* =========================
           PANEL
        ========================= */

        .panel {
            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 8px 30px
                rgba(15,23,42,.08);
        }

        .panel-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 22px;
        }

        .panel-header h2 {
            font-size: 27px;
        }


        /* =========================
           TOOLS
        ========================= */

        .tools {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .search,
        .filter {
            padding: 12px 15px;

            border:
                1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: white;
        }

        .search {
            width: 290px;
        }

        .filter {
            width: 190px;

            cursor: pointer;
        }

        .search:focus,
        .filter:focus {
            border-color: #2563eb;
        }


        /* =========================
           BUTTONS
        ========================= */

        .refresh-btn,
        .backup-btn {
            border: none;

            color: white;

            border-radius: 10px;

            padding: 12px 18px;

            cursor: pointer;

            font-weight: bold;
        }

        .refresh-btn {
            background: #2563eb;
        }

        .refresh-btn:hover {
            background: #1d4ed8;
        }

        .backup-btn {
            background: #16a34a;
        }

        .backup-btn:hover {
            background: #15803d;
        }

        .backup-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
        }


        /* =========================
           TABLE
        ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;

            -webkit-overflow-scrolling:
                touch;
        }

        table {
            width: 100%;

            min-width: 1150px;

            border-collapse: collapse;
        }

        th {
            background: #eaf2ff;

            color: #173b8f;

            padding: 16px;

            text-align: right;

            font-size: 15px;
        }

        td {
            padding: 15px;

            border-bottom:
                1px solid #e2e8f0;

            vertical-align: middle;
        }

        tr:hover td {
            background: #f8fbff;
        }

        .customer-name {
            font-weight: bold;
            color: #172554;
        }

        .phone {
            direction: ltr;
            text-align: right;

            font-weight: bold;
        }

        .service {
            display: inline-block;

            background: #dbeafe;
            color: #1d4ed8;

            padding: 7px 12px;

            border-radius: 20px;

            font-weight: bold;
        }

        .details-text {
            max-width: 260px;

            line-height: 1.7;
        }

        .date {
            color: #64748b;

            white-space: nowrap;

            direction: ltr;

            text-align: right;
        }


        /* =========================
           STATUS
        ========================= */

        .status-select {
            min-width: 155px;

            padding: 10px;

            border-radius: 10px;

            border:
                1px solid #cbd5e1;

            outline: none;

            font-weight: bold;

            cursor: pointer;
        }

        .status-select.new {
            color: #1d4ed8;
            background: #eff6ff;
        }

        .status-select.contacted {
            color: #92400e;
            background: #fef3c7;
        }

        .status-select.in_progress {
            color: #6d28d9;
            background: #f3e8ff;
        }

        .status-select.completed {
            color: #166534;
            background: #dcfce7;
        }

        .status-select.cancelled {
            color: #991b1b;
            background: #fee2e2;
        }


        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: flex;

            gap: 7px;

            flex-wrap: wrap;
        }

        .action-btn {
            border: none;

            color: white;

            padding: 9px 12px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .view-btn {
            background: #2563eb;
        }

        .whatsapp-btn {
            background: #16a34a;
        }

        .delete-btn {
            background: #dc2626;
        }

        .action-btn:hover {
            opacity: .88;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            background:
                rgba(15,23,42,.65);

            padding: 20px;

            overflow-y: auto;
        }

        .modal-box {
            position: relative;

            background: white;

            width: 100%;

            max-width: 700px;

            margin: 40px auto;

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.25);
        }

        .modal-box h2 {
            color: #173b8f;

            margin-bottom: 20px;

            font-size: 28px;
        }

        .close {
            position: absolute;

            left: 20px;
            top: 18px;

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background: #fee2e2;

            color: #dc2626;

            font-size: 24px;

            cursor: pointer;
        }

        .detail-row {
            padding: 15px 5px;

            border-bottom:
                1px solid #e2e8f0;
        }

        .detail-label {
            color: #64748b;

            font-size: 14px;

            margin-bottom: 7px;
        }

        .detail-value {
            color: #172554;

            font-size: 18px;

            font-weight: bold;

            word-break: break-word;

            line-height: 1.7;
        }

        .loading,
        .empty {
            text-align: center;

            padding: 45px;

            color: #64748b;

            font-size: 18px;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1100px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .header {
                flex-direction: column;

                align-items: flex-start;
            }

            .header-right {
                width: 100%;

                justify-content:
                    space-between;
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {
                overflow-x: hidden;
            }


            /* HEADER */

            .header {
                padding: 18px 14px;

                gap: 14px;
            }

            .brand {
                width: 100%;

                text-align: center;
            }

            .brand h1 {
                font-size: 25px;
            }

            .brand p {
                font-size: 13px;
            }

            .header-right {
                width: 100%;

                display: flex;

                justify-content:
                    space-between;

                align-items: center;

                gap: 8px;
            }

            .system-status {
                font-size: 13px;
            }

            .status-dot {
                width: 10px;
                height: 10px;
            }

            .logout-btn {
                padding: 10px 12px;

                font-size: 13px;
            }


            /* MAIN */

            .container {
                width: 94%;

                margin: 18px auto;
            }


            /* ALERT */

            #newRequestAlert {
                padding: 13px;

                font-size: 14px;

                gap: 10px;
            }

            .alert-content {
                gap: 7px;
            }


            /* STATS */

            .stats {
                grid-template-columns:
                    1fr 1fr;

                gap: 10px;

                margin-bottom: 18px;
            }

            .stat-card {
                padding: 17px 10px;

                border-radius: 15px;
            }

            .stat-title {
                font-size: 12px;

                margin-bottom: 8px;
            }

            .stat-number {
                font-size: 27px;
            }


            /* PANEL */

            .panel {
                padding: 14px;

                border-radius: 16px;
            }

            .panel-header {
                display: flex;

                flex-direction: column;

                align-items: stretch;

                margin-bottom: 17px;
            }

            .panel-header h2 {
                text-align: center;

                font-size: 24px;

                margin-bottom: 4px;
            }


            /* TOOLS */

            .tools {
                width: 100%;

                display: flex;

                flex-direction: column;

                gap: 9px;
            }

            .search,
            .filter,
            .refresh-btn,
            .backup-btn {
                width: 100%;

                min-width: 0;
            }

            .search,
            .filter {
                padding: 13px;

                font-size: 15px;
            }

            .refresh-btn,
            .backup-btn {
                padding: 13px;

                font-size: 15px;
            }


            /* TABLE */

            .table-wrapper {
                width: 100%;

                overflow-x: auto;

                border-radius: 10px;
            }

            table {
                min-width: 1050px;
            }

            th {
                padding: 13px 10px;

                font-size: 14px;
            }

            td {
                padding: 12px 10px;

                font-size: 14px;
            }


            /* ACTIONS */

            .actions {
                flex-direction: column;

                min-width: 110px;
            }

            .action-btn {
                width: 100%;

                white-space: nowrap;

                padding: 10px;
            }


            /* STATUS */

            .status-select {
                min-width: 145px;

                padding: 10px;
            }


            /* MODAL */

            .modal {
                padding: 10px;
            }

            .modal-box {
                margin: 15px auto;

                padding: 22px 16px;

                border-radius: 17px;
            }

            .modal-box h2 {
                font-size: 23px;

                padding-left: 35px;
            }

            .detail-value {
                font-size: 16px;
            }


            /* LOGIN */

            .login-box {
                padding: 30px 20px;

                border-radius: 20px;
            }

            .login-logo {
                width: 70px;
                height: 70px;

                font-size: 32px;
            }

            .login-box h1 {
                font-size: 26px;
            }

        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 420px) {

            .stats {
                gap: 8px;
            }

            .stat-card {
                padding: 14px 8px;
            }

            .stat-title {
                font-size: 11px;
            }

            .stat-number {
                font-size: 24px;
            }

            .brand h1 {
                font-size: 22px;
            }

            .logout-btn {
                font-size: 12px;

                padding: 9px 10px;
            }

            .system-status {
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            K
        </div>

        <h1>
            لوحة التحكم
        </h1>

        <p>
            إدارة طلبات العملاء
            <br>
            كرار علي
        </p>

        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            🔐 تسجيل الدخول
        </button>

        <div id="loginError">
            كلمة المرور غير صحيحة
        </div>

    </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <h1>
                لوحة التحكم
            </h1>

            <p>
                إدارة طلبات العملاء - كرار علي
            </p>

        </div>


        <div class="header-right">

            <div class="system-status">

                <span
                    id="statusDot"
                    class="status-dot"
                ></span>

                <span id="systemStatus">
                    النظام يعمل
                </span>

            </div>


            <button
                class="logout-btn"
                onclick="logout()"
            >
                🚪 تسجيل الخروج
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">


        <!-- NEW REQUEST ALERT -->

        <div id="newRequestAlert">

            <div class="alert-content">

                <span class="alert-icon">
                    🔔
                </span>

                <span id="alertText">
                    وصل طلب جديد!
                </span>

            </div>


            <button
                class="alert-close"
                onclick="closeNewRequestAlert()"
            >
                ×
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- STATISTICS -->

        <section class="stats">


            <div class="stat-card">

                <div class="stat-title">
                    إجمالي الطلبات
                </div>

                <div
                    id="totalRequests"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    طلبات اليوم
                </div>

                <div
                    id="todayRequests"
                    class="stat-number"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    آخر طلب
                </div>

                <div
                    id="lastRequest"
                    class="stat-number"
                >
                    -
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    حالة النظام
                </div>

                <div
                    id="systemText"
                    class="stat-number"
                    style="color:#16a34a;"
                >
                    يعمل
                </div>

            </div>


        </section>


        <!-- REQUESTS -->

        <section class="panel">


            <div class="panel-header">


                <h2>
                    طلبات العملاء
                </h2>


                <div class="tools">


                    <input
                        id="searchInput"
                        class="search"
                        type="text"
                        placeholder="🔎 ابحث بالاسم أو الهاتف أو الخدمة..."
                        oninput="filterRequests()"
                    >


                    <select
                        id="statusFilter"
                        class="filter"
                        onchange="filterRequests()"
                    >

                        <option value="all">
                            📋 كل الطلبات
                        </option>

                        <option value="new">
                            🆕 جديد
                        </option>

                        <option value="contacted">
                            📞 تم التواصل
                        </option>

                        <option value="in_progress">
                            ⚙️ قيد التنفيذ
                        </option>

                        <option value="completed">
                            ✅ مكتمل
                        </option>

                        <option value="cancelled">
                            ❌ ملغي
                        </option>

                    </select>


                    <button
                        class="refresh-btn"
                        onclick="loadDashboard()"
                    >
                        🔄 تحديث الطلبات
                    </button>


                    <button
                        id="backupBtn"
                        class="backup-btn"
                        onclick="createBackup()"
                    >
                        💾 إنشاء نسخة احتياطية
                    </button>


                </div>

            </div>


            <div
                id="tableArea"
                class="table-wrapper"
            >

                <div class="loading">
                    جاري تحميل الطلبات...
                </div>

            </div>


        </section>


    </main>

</div>


<!-- =====================================================
     DETAILS MODAL
===================================================== -->

<div
    id="detailsModal"
    class="modal"
>

    <div class="modal-box">


        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>


        <h2>
            تفاصيل الطلب
        </h2>


        <div
            id="detailsContent"
        ></div>


    </div>

</div>


<script>

"use strict";


/* =====================================================
   SETTINGS
===================================================== */

const API_URL = "";

let adminToken =
    localStorage.getItem(
        "krar_admin_token"
    );

let allRequests = [];

let previousRequestCount = null;

let previousLatestRequestId = null;

let notificationInterval = null;


/* =====================================================
   STATUS NAMES
===================================================== */

const STATUS_NAMES = {

    new:
        "🆕 جديد",

    contacted:
        "📞 تم التواصل",

    in_progress:
        "⚙️ قيد التنفيذ",

    completed:
        "✅ مكتمل",

    cancelled:
        "❌ ملغي"

};


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if (adminToken) {

            showDashboard();

        } else {

            showLogin();

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const password =
        document
            .getElementById(
                "password"
            )
            .value
            .trim();


    if (!password) {

        showLoginError(
            "يرجى إدخال كلمة المرور"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/admin/login`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            password:
                                password
                        })

                }
            );


        const result =
            await response.json();


        if (
            response.ok &&
            result.success
        ) {

            adminToken =
                result.token;


            localStorage.setItem(
                "krar_admin_token",
                adminToken
            );


            document
                .getElementById(
                    "password"
                )
                .value = "";


            showDashboard();


        } else {

            showLoginError(
                result.detail ||
                "كلمة المرور غير صحيحة"
            );

        }


    } catch (error) {

        console.error(error);

        showLoginError(
            "تعذر الاتصال بالخادم"
        );

    }

}

/* =====================================================
   AUTH HEADERS
===================================================== */

function authHeaders() {

    return {

        "Authorization":
            `Bearer ${adminToken}`

    };

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    try {

        if (adminToken) {

            await fetch(
                `${API_URL}/admin/logout`,
                {

                    method: "POST",

                    headers:
                        authHeaders()

                }
            );

        }

    } catch (error) {

        console.error(error);

    }


    localStorage.removeItem(
        "krar_admin_token"
    );


    adminToken = null;


    if (notificationInterval) {

        clearInterval(
            notificationInterval
        );

        notificationInterval =
            null;

    }


    showLogin();

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

    try {

        const response =
            await fetch(
                `${API_URL}/project-requests`,
                {

                    method: "GET",

                    headers:
                        authHeaders()

                }
            );


        if (response.status === 401) {

            await logout();

            return;

        }


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "حدث خطأ أثناء تحميل الطلبات"
            );

        }


        if (
            Array.isArray(result)
        ) {

            allRequests =
                result;

        } else {

            allRequests =
                result.requests ||
                result.data ||
                [];

        }


        renderRequests(
            allRequests
        );


        updateStatistics(
            allRequests
        );


        checkForNewRequests(
            allRequests
        );


        setSystemOnline();


    } catch (error) {

        console.error(error);

        setSystemOffline();

        showMessage(
            error.message ||
            "تعذر تحميل الطلبات",
            "error"
        );

    }

}


/* =====================================================
   BACKUP
===================================================== */

async function createBackup() {

    const button =
        document.getElementById(
            "backupBtn"
        );


    if (!button) {

        console.error(
            "زر النسخ الاحتياطي غير موجود"
        );

        return;

    }


    if (!adminToken) {

        showLogin();

        return;

    }


    const originalText =
        button.textContent;


    button.disabled = true;

    button.textContent =
        "⏳ جاري إنشاء النسخة...";


    try {

        const response =
            await fetch(
                `${API_URL}/admin/backup`,
                {

                    method: "POST",

                    headers:
                        authHeaders()

                }
            );


        let result = {};


        try {

            result =
                await response.json();

        } catch {

            result = {};

        }


        console.log(
            "Backup response:",
            response.status,
            result
        );


        if (response.status === 401) {

            await logout();

            return;

        }


        if (
            !response.ok ||
            result.success !== true
        ) {

            throw new Error(
                result.detail ||
                result.message ||
                "فشل إنشاء النسخة الاحتياطية"
            );

        }


        showMessage(
            `تم إنشاء النسخة الاحتياطية بنجاح 💾${
                result.filename
                    ? " - " + result.filename
                    : ""
            }`,
            "success"
        );


    } catch (error) {

        console.error(
            "Backup error:",
            error
        );


        showMessage(
            error.message ||
            "تعذر إنشاء النسخة الاحتياطية",
            "error"
        );


    } finally {

        button.disabled = false;

        button.textContent =
            originalText;

    }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(
    requests
) {

    document
        .getElementById(
            "totalRequests"
        )
        .textContent =
        requests.length;


    const today =
        new Date()
            .toISOString()
            .slice(0, 10);


    const todayRequests =
        requests.filter(
            request => {

                if (!request.created_at) {

                    return false;

                }


                return String(
                    request.created_at
                )
                    .slice(0, 10)
                    === today;

            }
        );


    document
        .getElementById(
            "todayRequests"
        )
        .textContent =
        todayRequests.length;


    if (requests.length) {

        document
            .getElementById(
                "lastRequest"
            )
            .textContent =
            "#" + requests[0].id;

    } else {

        document
            .getElementById(
                "lastRequest"
            )
            .textContent =
            "-";

    }

}


/* =====================================================

            </thead>

                <tr>

                    <td>

                            #${request.id}

                    </td>


                    <td>

                        <div class="customer-name">

                        ${

                                    <small>
                                        ${escapeHtml(

                                        )}

                                : ""
                        }

                    </td>


                    <td>

                        <div class="phone">

                            ${escapeHtml(
                                request.phone ||
                                "-"
                            )}

                        </div>

                    </td>


                    <td>

                        <span class="service">

                            ${escapeHtml(
                                request.service ||
                                "-"

                    </td>


                    <td>

                        <select

                                updateStatus(
                                    ${request.id},
                                    this.value,

                                )
                            "
                        >

                            <option

                                    ? "selected"

                            >

                            <option
                                value="contacted"

                                    : ""}

                            <option

                                    ? "selected"
                                    : ""}
                            >

                            </option>

                                value="completed"
                                ${status === "completed"
                                    ? "selected"
                                    : ""}

/* =====================================================
   FILTER
===================================================== */

function filterRequests() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const status =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const filtered =
        allRequests.filter(
            request => {

                const text = [

                    request.full_name,

                    request.company_name,

                    request.phone,

                    request.service,

                    request.project_details

                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    text.includes(search);


                const matchesStatus =
                    status === "all" ||
                    (
                        request.status ||
                        "new"
                    ) === status;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    renderRequests(
        filtered
    );

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(
    requestId,
    status,
    selectElement
) {

    try {

        const response =
            await fetch(
                `${API_URL}/project-requests/${requestId}/status`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        ...authHeaders()

                    },

                    body:
                        JSON.stringify({
                            status:
                                status
                        })

                }
            );


        const result =
            await response.json();


        if (response.status === 401) {

            await logout();

            return;

        }


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "فشل تحديث الحالة"
            );

        }


        selectElement.className =
            `status-select ${status}`;


        const request =
            allRequests.find(
                item =>
                    item.id === requestId
            );


        if (request) {

            request.status =
                status;

        }


        showMessage(
            "تم تحديث حالة الطلب بنجاح ✅",
            "success"
        );


    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "تعذر تحديث حالة الطلب",
            "error"
        );

    }

}

   DETAIL ROW
===================================================== */

function detailRow(
    label,
    value
) {

    return `

        <div class="detail-row">

            <div class="detail-label">

                ${escapeHtml(
                    label
                )}

            </div>

            <div class="detail-value">

                ${escapeHtml(
                    value ?? "-"
                )}

            </div>

/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

    document
        .getElementById(
            "detailsModal"
        )
        .style.display =
        "none";

}


/* =====================================================
   WHATSAPP
===================================================== */

function openWhatsApp(
    phone
) {

    let number =
        String(
            phone || ""
        )
            .replace(
                /\D/g,
                ""
            );


    if (
        number.startsWith("0")
    ) {

        number =
            "964" +
            number.substring(1);

    }


    if (!number) {

        alert(
            "رقم الهاتف غير موجود"
        );

        return;

    }


    window.open(
        `https://wa.me/${number}`,
        "_blank"
    );

}


/* =====================================================
   DELETE REQUEST
===================================================== */

async function deleteRequest(
    requestId
) {

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا الطلب؟"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/project-requests/${requestId}`,
                {

                    method: "DELETE",

                    headers:
                        authHeaders()

                }
            );


        const result =
            await response.json();


        if (response.status === 401) {

            await logout();

            return;

        }


        if (!response.ok) {

            throw new Error(
                result.detail ||
                "فشل حذف الطلب"
            );

        }


        showMessage(
            "تم حذف الطلب بنجاح 🗑️",
            "success"
        );


        await loadDashboard();


    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "تعذر حذف الطلب",
            "error"
        );

    }

}


/* =====================================================
   NEW REQUEST CHECK
===================================================== */

function checkForNewRequests(
    requests
) {

    if (
        previousRequestCount === null
    ) {

        previousRequestCount =
            requests.length;


        previousLatestRequestId =
            requests.length
                ? requests[0].id
                : null;


        return;

    }


    const latestId =
        requests.length
            ? requests[0].id
            : null;


    if (
        requests.length >
            previousRequestCount
        ||
        (
            latestId &&
            latestId !==
                previousLatestRequestId
        )
    ) {

        showNewRequestAlert(
            "🔔 وصل طلب جديد من أحد العملاء!"
        );

    }


    previousRequestCount =
        requests.length;


    previousLatestRequestId =
        latestId;

}

/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

        document
            .getElementById(
                "message"

        );

/* =====================================================
   DATE
===================================================== */

function formatDate(
    value
) {

    if (!value) {

        return "-";

    }


    try {

        const date =
            new Date(
                String(
                    value
                ).replace(
                    " ",
                    "T"
                )
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }


        return date.toLocaleString(
            "ar-IQ",
            {

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }
        );


    } catch {

        return value;

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJs(
    value
) {

    return String(
        value || ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\r/g,
            "\\r"
        )
        .replace(
            /\n/g,
            "\\n"
        );

}


/* =====================================================
   MODAL EVENTS
===================================================== */

window.addEventListener(
    "click",
    event => {

        const modal =
            document
                .getElementById(
                    "detailsModal"
                );


        if (
            event.target === modal
        ) {

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);
